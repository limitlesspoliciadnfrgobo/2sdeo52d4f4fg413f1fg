<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1eb">


  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(12px, 3vw, 32px);
      background: #f4f1eb;
      color: #202a36;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 1100px);
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
    }

    .certificado {
      margin: 0;
      padding: clamp(8px, 2vw, 20px);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 28px #202a361a;
    }

    .certificado img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
      margin: 0 auto;
    }

@media (max-width: 600px) {
  main {
    width: min(100%, 280px);
  }

  .certificado {
    padding: 4px;
  }

  .certificado img {
    width: 100%;
    max-height: 65svh;
  }
}
    
  </style>
</head>

<body>
  <main>
    <figure class="certificado">
      <img
        src="https://i.postimg.cc/cHqjyqgm/policia-Boliviana.png"
        alt="Imagen del certificado">
    </figure>
  </main>
</body>
</html>
